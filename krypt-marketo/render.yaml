# One-click deploy of Krypt Rewards on Render (render.com > New > Blueprint).
services:
  - type: web
    name: krypt-rewards
    runtime: docker
    rootDir: krypt-marketo
    dockerfilePath: ./Dockerfile.rewards
    plan: starter
    disk:
      name: rewards-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "10"
