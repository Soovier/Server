{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:32px auto">
  {% if mode == 'signup' %}
  <h1>Create your account</h1>
  <form class="card" method="post" action="/signup">
    <label>I want to</label>
    <select name="role">
      <option value="clipper" {{ 'selected' if role=='clipper' }}>Make clips and get paid (clipper)</option>
      <option value="brand" {{ 'selected' if role=='brand' }}>Run campaigns (brand / streamer)</option>
    </select>
    <label>Name</label><input name="name" required>
    <label>Email</label><input name="email" type="email" required>
    <label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required>
    <p><button style="width:100%">Sign up</button></p>
    <p class="muted">Already have an account? <a href="/login">Log in</a></p>
  </form>
  {% else %}
  <h1>Log in</h1>
  <form class="card" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email</label><input name="email" type="email" required autofocus>
    <label>Password</label><input name="password" type="password" required>
    <p><button style="width:100%">Log in</button></p>
    <p class="muted">New here? <a href="/signup">Sign up</a></p>
  </form>
  {% endif %}
</div>
{% endblock %}
